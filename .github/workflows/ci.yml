name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '*/10 * * * *' # keep the free-tier demo instance warm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  keep-warm:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping live deployment health endpoint
        run: curl -fsS --max-time 120 https://lablink-yl99.onrender.com/api/health
